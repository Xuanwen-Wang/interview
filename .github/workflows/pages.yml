name: Build and publish field guide

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build portable HTML
        run: python3 scripts/build.py
      - name: Validate content and links
        run: |
          python3 scripts/check.py
          node --check web/app.js
          node --check web/catalog.js
          node --check web/reading.js
          node --check web/pe-explorer.js
          node scripts/check_pe_model.js
      - name: Verify original coding references
        run: |
          python3 -m unittest discover -s practice -v
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined practice/coding.cpp -o "$RUNNER_TEMP/coding-check"
          "$RUNNER_TEMP/coding-check"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
